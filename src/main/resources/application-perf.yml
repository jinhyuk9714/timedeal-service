server:
  port: 8080

jwt:
  # 실제 성능 테스트에서는 환경변수/외부 설정으로 교체하는 것이 이상적이지만,
  # 여기서는 local과 동일하게 둡니다.
  secret: your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-please-change-this-in-production
  expiration: 86400000

info:
  app:
    name: 타임딜 서비스 (PERF)
    description: 성능 테스트용 프로파일
    version: 0.0.1-SNAPSHOT

spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        page-parameter: page
        size-parameter: size
        sort: id,desc

  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:mysql://localhost:3306/timedeal?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: timedeal
    password: timedeal
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      # 스키마는 미리 맞춰두었다고 가정하고 validate 사용
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        use_sql_comments: false
    open-in-view: false

  redis:
    host: localhost
    port: 6379

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    p6spy: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

